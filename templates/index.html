<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>ProcessDoc AI</title>
    <style>
        /* Base layout */
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
            color: #333;
        }

        h1 {
            color: #2c3e50;
            border-bottom: 3px solid #3498db;
            padding-bottom: 10px;
        }

        /* Process input field */
        input[type="text"] {
            width: 60%;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        /* Shared button style */
        button {
            padding: 10px 20px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #2980b9;
        }

        /* Table styling for generated documentation */
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }

        th, td {
            padding: 10px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background-color: #3498db;
            color: white;
        }

        /* Alternating row color for readability */
        tr:nth-child(even) {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>

    <h1>ProcessDoc AI</h1>
    <p>Gib einen Prozess ein und erhalte eine strukturierte Dokumentation</p>

    <!-- Form to submit the process name to the /generate route -->
    <form id="generate-form" action="/generate" method="POST">
        <input
            type="text"
            name="prozess_name"
            placeholder="z.B. Neuer Mitarbeiter Onboarding">
        <button type="submit">Dokumentation erstellen</button>
    </form>

    <!-- Loading indicator shown while the AI is generating -->
    <div id="spinner" style="display:none; margin-top:20px; color:#3498db;">
        Dokumentation wird generiert...
    </div>

    <!-- Result section — only shown after a successful generation -->
    {% if result %}
        <h2>Deine Dokumentation:</h2>
        <!-- | safe allows rendered HTML from Markdown conversion -->
        <p>{{ result | safe }}</p>

        <!-- Download and navigation buttons -->
        <div style="display:flex; gap:10px; margin-top:20px;">
            <!-- Hidden field passes the raw Markdown text to the download routes -->
            <form action="/pdf_download" method="POST">
                <input type="hidden" name="content" value="{{ result_text }}">
                <button type="submit">Download als PDF</button>
            </form>

            <form action="/docx_download" method="POST">
                <input type="hidden" name="content" value="{{ result_text }}">
                <button type="submit">Download als DOCX</button>
            </form>

            <form action="/history" method="GET">
                <button type="submit">Verlauf</button>
            </form>
        </div>
    {% endif %}

    <!-- Error message shown if no input was provided -->
    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}

    <script>
        // Show loading spinner when the generate form is submitted
        document.getElementById("generate-form").addEventListener("submit", function() {
            document.getElementById("spinner").style.display = "block";
        });
    </script>

</body>
</html>
